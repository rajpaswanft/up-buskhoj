<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP BusKhoj - Live UPSRTC Schedule & Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <span class="header-icon">🚌</span>
    <div>
      <h1>UP BusKhoj</h1>
      <p>UPSRTC Live Bus Tracker & Schedule</p>
    </div>
  </header>

  <main class="main-container">
    <section class="search-card">
      <div class="input-group">
        <label for="districtSelect">District (ज़िला चुनें)</label>
        <select id="districtSelect">
          <option value="Deoria">Deoria (देवरिया)</option>
          <option value="Gorakhpur">Gorakhpur (गोरखपुर)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="fromStop">Kahan Se (Boarding Stop)</label>
        <select id="fromStop"></select>
      </div>

      <div class="input-group">
        <label for="toStop">Kahan Tak (Destination)</label>
        <select id="toStop"></select>
      </div>

      <button id="searchBtn" class="btn-primary">Buses Khojein</button>
    </section>

    <section class="results-container">
      <div id="statusMessage" class="status-msg"></div>
      <div id="nextBusWrapper"></div>
      <div id="upcomingBusesWrapper"></div>
      <div id="pastBusesWrapper" class="hidden">
        <button id="togglePastBtn" class="btn-secondary">Pehle nikal chuki buses dekhein</button>
        <div id="pastBusesList" class="hidden" style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </section>
  </main>

  <div id="mapModal" class="map-modal hidden">
    <div class="map-modal-content">
      <div class="map-modal-header">
        <h4 id="mapRouteTitle" style="font-size: 1rem; font-weight: 700;">Route Map</h4>
        <button id="closeMapBtn" class="btn-close">&times;</button>
      </div>
      <div id="mapContainer" style="height: 260px; width: 100%; border-radius: 10px;"></div>
      <div class="map-actions">
        <button id="trackGpsBtn" class="btn-gps">📍 Live GPS</button>
        <span id="gpsStatusText" style="font-size: 0.78rem; color: #64748b;">GPS Ready</span>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DATA = {
      "Deoria": {
        stops: [
          "Deoria Sadar Bus Station", "Kacheri Bus Stand", "Kasya Dhala", "Overbridge / SSBL Gate",
          "Purva Chauraha", "Salempur Bus Stand", "Rudrapur Bus Station", "Barhaj Bus Stand",
          "Bhatpar Rani", "Lar Road / Lar", "Bhatni Bus Stand", "Gauri Bazar", "Baitalpur",
          "Tarkulwa", "Rampur Karkhana", "Khukhundoo", "Bhagalpur", "Kaparwar Ghat", "Mail", "Mehrauna Ghat"
        ],
        routes: [
          {
            from: "Deoria Sadar Bus Station",
            to: "Gorakhpur Railway Bus Station",
            type: "Ordinary Non-AC",
            fare: 80,
            via: ["Baitalpur", "Gauri Bazar", "Chauri Chaura Bus Stand"],
            departures: ["04:30","05:30","06:30","07:30","08:30","09:30","10:30","11:30","12:30","13:30","14:30","15:30","16:30","17:30","18:30","19:30","20:30","21:30"]
          },
          {
            from: "Deoria Sadar Bus Station",
            to: "Salempur Bus Stand",
            type: "Local Ordinary",
            fare: 30,
            via: ["Purva Chauraha", "Khukhundoo"],
            departures: ["06:00","07:30","09:00","10:30","12:00","13:30","15:00","16:30","18:00","19:30"]
          },
          {
            from: "Deoria Sadar Bus Station",
            to: "Barhaj Bus Stand",
            type: "Local Ordinary",
            fare: 35,
            via: ["Mail", "Kaparwar Ghat"],
            departures: ["06:30","08:00","09:30","11:00","13:00","15:00","17:00","18:30"]
          },
          {
            from: "Deoria Sadar Bus Station",
            to: "Rudrapur Bus Station",
            type: "Local Ordinary",
            fare: 28,
            via: ["Gauri Bazar"],
            departures: ["07:00","08:30","10:00","11:30","13:30","15:30","17:30"]
          },
          {
            from: "Deoria Sadar Bus Station",
            to: "Varanasi Cantt ISBT",
            type: "Express",
            fare: 215,
            via: ["Salempur Bus Stand", "Lar Road / Lar", "Dohrighat", "Mau", "Saidpur"],
            departures: ["05:30","07:00","08:45","11:00","13:15","15:30","18:00"]
          }
        ]
      },
      "Gorakhpur": {
        stops: [
          "Gorakhpur Railway Bus Station", "Gorakhpur Kachehri Bus Station", "Nausad Bus Station",
          "Mohaddipur Chowk Bus Stop", "Medical College (BRD) Bus Stop", "Sahjanwa Bus Stand",
          "Chauri Chaura Bus Stand", "Bansgaon Bus Stand", "Gola Bazar Bus Station",
          "Barhalganj Bus Station", "Campierganj Bus Stand", "Khajni Bus Stop", "Kauriram Bus Stop"
        ],
        routes: [
          {
            from: "Gorakhpur Railway Bus Station",
            to: "Deoria Sadar Bus Station",
            type: "Ordinary Non-AC",
            fare: 80,
            via: ["Chauri Chaura Bus Stand", "Gauri Bazar", "Baitalpur"],
            departures: ["05:00","06:00","07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"]
          },
          {
            from: "Gorakhpur Railway Bus Station",
            to: "Barhalganj Bus Station",
            type: "Local Ordinary",
            fare: 75,
            via: ["Nausad Bus Station", "Kauriram Bus Stop"],
            departures: ["06:00","07:30","09:00","11:00","13:00","15:00","17:00","18:30"]
          },
          {
            from: "Nausad Bus Station",
            to: "Varanasi Cantt ISBT",
            type: "Express",
            fare: 320,
            via: ["Kauriram Bus Stop", "Barhalganj Bus Station", "Dohrighat", "Mau", "Saidpur"],
            departures: ["06:00","08:00","10:00","12:00","14:00","16:00","18:00"]
          }
        ]
      }
    };

    const COORDS = {
      "Deoria Sadar Bus Station": [26.5020, 83.7791],
      "Kacheri Bus Stand": [26.5058, 83.7842],
      "Kasya Dhala": [26.5112, 83.7885],
      "Overbridge / SSBL Gate": [26.5005, 83.7750],
      "Purva Chauraha": [26.4950, 83.7820],
      "Salempur Bus Stand": [26.3015, 83.9248],
      "Rudrapur Bus Station": [26.4385, 83.6214],
      "Barhaj Bus Stand": [26.2842, 83.7540],
      "Bhatpar Rani": [26.2482, 84.0531],
      "Lar Road / Lar": [26.2085, 83.9712],
      "Bhatni Bus Stand": [26.5684, 83.9721],
      "Gauri Bazar": [26.5861, 83.6933],
      "Baitalpur": [26.5505, 83.7431],
      "Tarkulwa": [26.6185, 83.8760],
      "Rampur Karkhana": [26.5695, 83.8210],
      "Khukhundoo": [26.3980, 83.8540],
      "Bhagalpur": [26.2150, 83.8230],
      "Kaparwar Ghat": [26.2750, 83.6890],
      "Mail": [26.3380, 83.7310],
      "Mehrauna Ghat": [26.1750, 84.0120],
      "Gorakhpur Railway Bus Station": [26.7588, 83.3813],
      "Gorakhpur Kachehri Bus Station": [26.7620, 83.3750],
      "Nausad Bus Station": [26.7025, 83.3481],
      "Mohaddipur Chowk Bus Stop": [26.7505, 83.3985],
      "Medical College (BRD) Bus Stop": [26.7920, 83.3850],
      "Sahjanwa Bus Stand": [26.7725, 83.1812],
      "Chauri Chaura Bus Stand": [26.6432, 83.6062],
      "Bansgaon Bus Stand": [26.5580, 83.3510],
      "Gola Bazar Bus Station": [26.3520, 83.3540],
      "Barhalganj Bus Station": [26.2820, 83.5015],
      "Campierganj Bus Stand": [27.0250, 83.2750],
      "Khajni Bus Stop": [26.6510, 83.2210],
      "Kauriram Bus Stop": [26.5410, 83.3980],
      "Dohrighat": [26.2612, 83.5234],
      "Mau": [25.9416, 83.5602],
      "Saidpur": [25.5492, 83.1932],
      "Varanasi Cantt ISBT": [25.3284, 82.9868]
    };

    const districtSelect = document.getElementById("districtSelect");
    const fromSelect = document.getElementById("fromStop");
    const toSelect = document.getElementById("toStop");

    function setupDropdowns() {
      const dist = districtSelect.value;
      const distData = DATA[dist];

      fromSelect.innerHTML = '<option value="">Sabhi Boarding Stops</option>';
      distData.stops.forEach(s => {
        fromSelect.innerHTML += `<option value="${s}">${s}</option>`;
      });

      toSelect.innerHTML = '<option value="">Sabhi Routes Dekhein</option>';
      const uniqueDest = [...new Set(distData.routes.map(r => r.to))];
      uniqueDest.forEach(d => {
        toSelect.innerHTML += `<option value="${d}">${d}</option>`;
      });
    }

    function searchBuses() {
      const dist = districtSelect.value;
      const fromVal = fromSelect.value;
      const toVal = toSelect.value;
      const routes = DATA[dist].routes;

      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      let matches = [];

      routes.forEach(r => {
        const matchFrom = !fromVal || r.from === fromVal || r.via.includes(fromVal);
        const matchTo = !toVal || r.to === toVal;

        if (matchFrom && matchTo) {
          r.departures.forEach(time => {
            const [h, m] = time.split(":").map(Number);
            matches.push({
              time,
              minutes: h * 60 + m,
              from: r.from,
              to: r.to,
              type: r.type,
              fare: r.fare,
              via: r.via
            });
          });
        }
      });

      matches.sort((a, b) => a.minutes - b.minutes);

      const upcoming = matches.filter(m => m.minutes >= currentMin);
      const past = matches.filter(m => m.minutes < currentMin);

      const nextWrap = document.getElementById("nextBusWrapper");
      const upWrap = document.getElementById("upcomingBusesWrapper");
      const pastList = document.getElementById("pastBusesList");
      const pastWrap = document.getElementById("pastBusesWrapper");

      nextWrap.innerHTML = "";
      upWrap.innerHTML = "";
      pastList.innerHTML = "";

      if (upcoming.length > 0) {
        const next = upcoming[0];
        const diff = next.minutes - currentMin;
        nextWrap.innerHTML = `
          <div class="bus-card next-bus">
            <div class="bus-header">
              <span class="badge-type">${next.type}</span>
              <span class="badge-fare">₹${next.fare}</span>
            </div>
            <div class="bus-time-row">
              <div>
                <div class="time-val">${next.time}</div>
                <div class="station-name">${next.from}</div>
              </div>
              <div style="text-align: right;">
                <div style="font-weight:700; color:#2563eb; font-size:0.85rem;">NEXT BUS</div>
                <div class="station-name">${diff === 0 ? 'Abhi rawana' : diff + ' min me'}</div>
              </div>
            </div>
            <div class="via-text">Via: ${next.via.join(" ➔ ")} ➔ ${next.to}</div>
            <button class="btn-track" onclick="showMap('${next.from}', '${next.to}', ${JSON.stringify(next.via).replace(/"/g, '&quot;')})">🗺️ Route Map & Live GPS</button>
          </div>
        `;

        upcoming.slice(1).forEach(b => {
          upWrap.innerHTML += renderCard(b);
        });
      } else {
        nextWrap.innerHTML = '<div class="status-msg">Is search par aage koi bus scheduled nahi hai.</div>';
      }

      if (past.length > 0) {
        pastWrap.classList.remove("hidden");
        past.forEach(b => { pastList.innerHTML += renderCard(b, true); });
      } else {
        pastWrap.classList.add("hidden");
      }
    }

    function renderCard(b, isPast = false) {
      return `
        <div class="bus-card" style="${isPast ? 'opacity:0.55;' : ''}">
          <div class="bus-header">
            <span class="badge-type">${b.type}</span>
            <span class="badge-fare">₹${b.fare}</span>
          </div>
          <div class="bus-time-row">
            <div>
              <div class="time-val">${b.time}</div>
              <div class="station-name">${b.from}</div>
            </div>
            <div style="text-align: right;">
              <div class="station-name">${b.to}</div>
              <div style="font-size:0.75rem; color:#64748b;">${isPast ? 'Departed' : 'Scheduled'}</div>
            </div>
          </div>
          <div class="via-text">Via: ${b.via.join(" ➔ ")}</div>
          <button class="btn-track" onclick="showMap('${b.from}', '${b.to}', ${JSON.stringify(b.via).replace(/"/g, '&quot;')})">🗺️ Route Map</button>
        </div>
      `;
    }

    let map = null;
    let polyline = null;
    let watchId = null;

    function showMap(from, to, via) {
      document.getElementById("mapModal").classList.remove("hidden");
      document.getElementById("mapRouteTitle").innerText = `${from} ➔ ${to}`;

      setTimeout(() => {
        if (!map) {
          map = L.map("mapContainer").setView([26.5020, 83.7791], 10);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
        } else {
          map.invalidateSize();
        }

        if (polyline) map.removeLayer(polyline);

        const routeStops = [from, ...via, to];
        const points = [];

        routeStops.forEach(st => {
          const pt = COORDS[st];
          if (pt) {
            points.push(pt);
            L.marker(pt).addTo(map).bindPopup(st);
          }
        });

        if (points.length > 1) {
          polyline = L.polyline(points, { color: "#107c41", weight: 5 }).addTo(map);
          map.fitBounds(polyline.getBounds(), { padding: [25, 25] });
        }
      }, 200);
    }

    document.getElementById("closeMapBtn").onclick = () => {
      document.getElementById("mapModal").classList.add("hidden");
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    };

    document.getElementById("trackGpsBtn").onclick = () => {
      const txt = document.getElementById("gpsStatusText");
      if (!navigator.geolocation) return txt.innerText = "No GPS";
      txt.innerText = "Locating...";
      watchId = navigator.geolocation.watchPosition(pos => {
        txt.innerText = "Live GPS Active";
        map.panTo([pos.coords.latitude, pos.coords.longitude]);
      });
    };

    document.getElementById("togglePastBtn").onclick = () => {
      document.getElementById("pastBusesList").classList.toggle("hidden");
    };

    districtSelect.onchange = setupDropdowns;
    document.getElementById("searchBtn").onclick = searchBuses;

    setupDropdowns();
    searchBuses();
  </script>
</body>
</html>
