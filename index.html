<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP Roadways Live Timetable</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --ink-main: #1a1a1a;
      --ink-muted: #666666;
      --primary: #d9381e;
      --board-green: #0a7c42;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--ink-main);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    header {
      background: #1a252f;
      color: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.1rem;
      margin: 0;
    }
    #liveClock {
      font-size: 0.85rem;
      background: rgba(255,255,255,0.15);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .search-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 15px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--ink-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .row-two {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .swap-btn {
      width: auto;
      padding: 10px 14px;
      background: #e2e8f0;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .search-btn {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 5px;
      cursor: pointer;
    }
    .status-msg {
      font-size: 0.8rem;
      color: var(--ink-muted);
      margin-top: 8px;
      text-align: center;
    }
    .quick-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .chip {
      background: #e9ecef;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0 8px;
    }
    .results-header h2 {
      font-size: 1rem;
      margin: 0;
    }
    .bus-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      position: relative;
    }
    .bus-card.next-bus {
      border: 2px solid var(--board-green);
      background: #f0fff4;
    }
    .bus-card.past-bus {
      opacity: 0.6;
    }
    .bus-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      background: #eee;
    }
    .badge.ordinary { background: #e3f2fd; color: #0d47a1; }
    .badge.express { background: #fff3e0; color: #e65100; }
    .fare {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--primary);
    }
    .countdown-tag {
      font-size: 0.75rem;
      font-weight: bold;
      margin: 6px 0;
    }
    .countdown-tag.next { color: var(--board-green); }
    .countdown-tag.upcoming { color: #d97706; }
    .countdown-tag.past { color: #718096; }
    .bus-time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
    }
    .time {
      font-size: 1.2rem;
      font-weight: bold;
      display: block;
    }
    .station {
      font-size: 0.75rem;
      color: var(--ink-muted);
    }
    .duration-line {
      text-align: center;
      font-size: 0.7rem;
      color: var(--ink-muted);
    }
    .duration-line .line {
      height: 2px;
      width: 60px;
      background: #cbd5e0;
      margin: 2px auto;
    }
    .via-note {
      font-size: 0.75rem;
      color: var(--ink-muted);
      border-top: 1px dashed var(--border);
      padding-top: 6px;
      margin-top: 6px;
    }
    .bus-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--ink-muted);
    }
    .track-btn {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: #edf2f7;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      cursor: pointer;
    }
    .past-section {
      margin-top: 20px;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: var(--ink-muted);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 10px;
    }
    .collapsed { display: none; }
  </style>
</head>

      if (isLong) {
        approxKm = 150; // Long distance intercity
      } else if (!isSameDistrict && durationMins > 90) {
        approxKm = 100; // Neighboring major district ~100km
      }

      let estimated = Math.round(approxKm * 1.30); // ₹1.30 per km rate
      return { amount: estimated, isExact: false };
    }

    const districtSelect = document.getElementById("districtSelect");
    const fromStop = document.getElementById("fromStop");
    const toStop = document.getElementById("toStop");
    const searchBtn = document.getElementById("searchBtn");
    const swapBtn = document.getElementById("swapBtn");
    const statusMsg = document.getElementById("statusMessage");

    function initDistrictList() {
      districtSelect.innerHTML = "";
      ALL_75_DISTRICTS.forEach(dist => {
        const opt = document.createElement("option");
        opt.value = dist;
        opt.textContent = `${dist} (${dist === "Deoria" ? "देवरिया" : dist === "Gorakhpur" ? "गोरखपुर" : "ज़िला"})`;
        districtSelect.appendChild(opt);
      });

      districtSelect.value = "Deoria";
      buildStopsDropdowns("Deoria");
    }

    function buildStopsDropdowns(selectedDistrict) {
      const currentDistrictStops = DISTRICT_STOPS[selectedDistrict] || [];

      fromStop.innerHTML = "";
      currentDistrictStops.forEach(st => {
        fromStop.innerHTML += `<option value="${st}">${st}</option>`;
      });

      toStop.innerHTML = "";

      let optGroupHubs = `<optgroup label="🌟 Major UP State Depots & Cities">`;
      MAJOR_UP_HUBS.forEach(hub => {
        if (!currentDistrictStops.includes(hub)) {
          optGroupHubs += `<option value="${hub}">${hub}</option>`;
        }
      });
      optGroupHubs += `</optgroup>`;
      toStop.innerHTML += optGroupHubs;

      let optGroupLocal = `<optgroup label="📍 ${selectedDistrict} Local Stops">`;
      currentDistrictStops.forEach(st => {
        optGroupLocal += `<option value="${st}">${st}</option>`;
      });
      optGroupLocal += `</optgroup>`;
      toStop.innerHTML += optGroupLocal;

      ALL_75_DISTRICTS.forEach(d => {
        if (d !== selectedDistrict) {
          let distGroup = `<optgroup label="🏢 ${d} District Stops">`;
          DISTRICT_STOPS[d].forEach(dstStop => {
            if (!MAJOR_UP_HUBS.includes(dstStop)) {
              distGroup += `<option value="${dstStop}">${dstStop}</option>`;
            }
          });
          distGroup += `</optgroup>`;
          toStop.innerHTML += distGroup;
        }
      });

      if (selectedDistrict === "Deoria") {
        fromStop.value = "Deoria Sadar Bus Stand";
        toStop.value = "Gorakhpur Railway Station";
      } else if (selectedDistrict === "Gorakhpur") {
        fromStop.value = "Gorakhpur Railway Station";
        toStop.value = "Alambagh ISBT (Lucknow)";
      } else {
        fromStop.selectedIndex = 0;
        toStop.value = "Alambagh ISBT (Lucknow)";
      }

      statusMsg.innerText = `${selectedDistrict} boarding active. Destination mein pure UP ka koi bhi stand chunein.`;
      renderSchedule();
    }

    districtSelect.addEventListener("change", (e) => {
      buildStopsDropdowns(e.target.value);
    });

    window.quickSelect = function(dist, from, to) {
      districtSelect.value = dist;
      buildStopsDropdowns(dist);
      setTimeout(() => {
        fromStop.value = from;
        toStop.value = to;
        renderSchedule();
      }, 40);
    };

    swapBtn.addEventListener("click", () => {
      const temp = fromStop.value;
      fromStop.value = toStop.value;
      toStop.value = temp;
      renderSchedule();
    });

    function toMinutes(t) {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function calculateArrival(depTime, durMins) {
      const mins = (toMinutes(depTime) + (durMins || 60)) % (24 * 60);
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function renderSchedule() {
      const fromVal = fromStop.value;
      const toVal = toStop.value;
      const now = new Date();
      const curMin = now.getHours() * 60 + now.getMinutes();

      let matched = [];

      MASTER_ROUTES.forEach(r => {
        const matchFrom = !fromVal || r.from === fromVal || r.via.includes(fromVal);
        const matchTo = !toVal || r.to === toVal;

        if (matchFrom && matchTo) {
          r.departures.forEach(time => {
            matched.push({
              time,
              minutes: toMinutes(time),
              arrivalTime: calculateArrival(time, r.durationMins),
              from: r.from,
              to: r.to,
              type: r.type,
              typeLabel: r.typeLabel,
              fare: r.fare,
              isExactFare: true,
              duration: r.duration,
              via: r.via
            });
          });
        }
      });

      // Local vs Long Distance Dynamic Fare Fix
      if (matched.length === 0 && fromVal && toVal && fromVal !== toVal) {
        const isLongDistance = toVal.includes("Lucknow") || toVal.includes("Delhi") || toVal.includes("Kanpur") || toVal.includes("Agra") || toVal.includes("Varanasi");
        const durationMins = isLongDistance ? 360 : 45; // 45m for local, 6h for intercity
        const fareData = calculateFare(fromVal, toVal, durationMins, isLongDistance);

        const scheduleTimes = [
          "06:00","07:00","08:00","09:00","10:00","11:00","12:00",
          "13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"
        ];

        scheduleTimes.forEach(t => {
          matched.push({
            time: t,
            minutes: toMinutes(t),
            arrivalTime: calculateArrival(t, durationMins),
            from: fromVal,
            to: toVal,
            type: isLongDistance ? "express" : "ordinary",
            typeLabel: isLongDistance ? "UPSRTC Express" : "State Roadways Local",
            fare: fareData.amount,
            isExactFare: false,
            duration: isLongDistance ? "6h 00m" : "45m",
            via: ["State Highway Corridor"]
          });
        });
      }

      matched.sort((a, b) => a.minutes - b.minutes);

      const upcoming = matched.filter(m => m.minutes >= curMin);
      const past = matched.filter(m => m.minutes < curMin);

      const busList = document.getElementById("busList");
      const pastBusList = document.getElementById("pastBusList");
      const togglePastBtn = document.getElementById("togglePastBtn");
      const resultCount = document.getElementById("resultCount");

      busList.innerHTML = "";
      pastBusList.innerHTML = "";

      if (upcoming.length === 0 && matched.length > 0) {
        const tomorrowFirst = matched[0];
        const diff = (24 * 60 - curMin) + tomorrowFirst.minutes;
        resultCount.innerText = "Subah ki pehli bus active";
        busList.innerHTML += buildCard(tomorrowFirst, 0, diff, true, false, true);
      } else if (upcoming.length > 0) {
        resultCount.innerText = `${upcoming.length} available`;
        const next = upcoming[0];
        const diff = next.minutes - curMin;
        busList.innerHTML += buildCard(next, 0, diff, true, false, false);

        upcoming.slice(1).forEach((b, idx) => {
          busList.innerHTML += buildCard(b, idx + 1, b.minutes - curMin, false, false, false);
        });
      } else {
        resultCount.innerText = "0 available";
        busList.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--ink-muted);">Kripya kahan se aur kahan tak chunein.</div>`;
      }

      if (past.length > 0) {
        togglePastBtn.hidden = false;
        past.forEach((b, idx) => {
          pastBusList.innerHTML += buildCard(b, 100 + idx, 0, false, true, false);
        });
      } else {
        togglePastBtn.hidden = true;
      }
    }

    function buildCard(b, id, diff, isNext, isPast, isTomorrow = false) {
      let cardClass = "bus-card";
      let countdownHTML = "";

      if (isNext) {
        cardClass += " next-bus";
        const label = isTomorrow ? `Kal Subah (${b.time})` : (diff === 0 ? 'Abhi Rawana' : `${diff} min me`);
        countdownHTML = `<div class="countdown-tag next">● NEXT BUS: ${label}</div>`;
      } else if (isPast) {
        cardClass += " past-bus";
        countdownHTML = `<div class="countdown-tag past">Nikal chuki hai</div>`;
      } else {
        countdownHTML = `<div class="countdown-tag upcoming">${diff} min baad</div>`;
      }

      const fareHTML = b.isExactFare 
        ? `₹${b.fare}` 
        : `₹${b.fare} <span style="font-size: 0.62rem; font-weight: 600; color: #777;">(approx)</span>`;

      return `
        <article class="${cardClass}">
          <span class="timeline-dot"></span>
          <div class="bus-card-top">
            <span class="badge ${b.type}">${b.typeLabel}</span>
            ${isNext ? '<span class="next-badge">NEXT BUS</span>' : ''}
            <span class="fare">${fareHTML}</span>
          </div>

          ${countdownHTML}

          <div class="bus-time-row">
            <div>
              <span class="time">${b.time}</span>
              <span class="station">${b.from}</span>
            </div>
            <div class="duration-line">
              <div class="line"></div>
              <span>${b.duration}</span>
            </div>
            <div>
              <span class="time" style="color: var(--board-green);">${b.arrivalTime}</span>
              <span class="station">${b.to}</span>
            </div>
          </div>

          <div class="via-note">
            <strong>Via:</strong> ${b.via.join(" &bull; ")}
          </div>

          <div class="bus-card-footer">
            <span>UPSRTC Roadways Service</span>
            <button class="track-btn" type="button" onclick="alert('GPS Route: ${b.from} se ${b.to} live on corridor.')">
              Route / Live Track
            </button>
          </div>
        </article>
      `;
    }

    document.getElementById("togglePastBtn").addEventListener("click", () => {
      const pastList = document.getElementById("pastBusList");
      pastList.classList.toggle("collapsed");
      document.querySelector("#togglePastBtn .toggle-icon").innerText = pastList.classList.contains("collapsed") ? "▾" : "▴";
    });

    function updateClock() {
      const clockEl = document.getElementById("liveClock");
      if (!clockEl) return;
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      clockEl.innerText = `${h}:${m}:${s} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    searchBtn.addEventListener("click", renderSchedule);

    initDistrictList();
  </script>
</body>
</html>
