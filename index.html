<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP BusKhoj - Live Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d32f2f; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #d32f2f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #b71c1c; }
        #results { margin-top: 20px; text-align: left; }
        .bus-card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px; background: #fafafa; }
        .loading { color: #1976d2; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚌 UP BusKhoj</h2>
        <input type="text" id="fromCity" placeholder="Kahan Se? (eg. luck)" value="luck">
        <input type="text" id="toCity" placeholder="Kahan Tak? (eg. deoria)" value="deoria">
        <button onclick="searchBuses()">Search Buses</button>
        
        <div id="results"></div>
    </div>

    <script>
        // Aapki API Key aur Parse.bot ka unique Scraper ID
        const API_KEY = "pmx_cd56769521b980e2927f2691ec11e85f";
        const BASE_URL = "https://api.parse.bot/scraper/a8a2f054-e180-4156-b441-22a99770e4f1";

        async function fetchStationCode(cityName) {
            const url = `${BASE_URL}/search_stations?query=${cityName}`;
            const response = await fetch(url, { headers: { "X-API-Key": API_KEY } });
            if (!response.ok) throw new Error("API Limit reached or error!");
            
            const json = await response.json();
            if (json.data && json.data.stations.length > 0) {
                return json.data.stations[0].station_code; // Pehle station ka code return karega
            }
            return null;
        }

        async function searchBuses() {
            const from = document.getElementById("fromCity").value.trim();
            const to = document.getElementById("toCity").value.trim();
            const resultsDiv = document.getElementById("results");

            if(!from || !to) {
                alert("Dono sheher ka naam daalein!");
                return;
            }

            resultsDiv.innerHTML = "<p class='loading'>Station Codes nikal rahe hain...</p>";

            try {
                // Step 1: Origin aur Destination ke station code nikalo
                const originCode = await fetchStationCode(from);
                const destCode = await fetchStationCode(to);

                if (!originCode || !destCode) {
                    resultsDiv.innerHTML = "<p style='color:red;'>Station nahi mila. Sahi naam daalein!</p>";
                    return;
                }

                resultsDiv.innerHTML = "<p class='loading'>Buses search ho rahi hain...</p>";

                // Step 2: Bus Schedule API Call karo
                const busUrl = `${BASE_URL}/search_bus_schedules?origin=${originCode}&destination=${destCode}`;
                const busResponse = await fetch(busUrl, { headers: { "X-API-Key": API_KEY } });
                
                if (!busResponse.ok) throw new Error("Too many requests! 1 minute ruko.");

                const busData = await busResponse.json();
                displayBuses(busData);

            } catch (error) {
                resultsDiv.innerHTML = `<p style='color:red;'>Error: ${error.message}</p>`;
                console.error(error);
            }
        }

        function displayBuses(data) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = ""; // Purana data clear karo

            // Parse.bot ke response structure ke hisab se data check kar rahe hain
            if (!data.data || !data.data.trips || data.data.trips.length === 0) {
                resultsDiv.innerHTML = "<p>Koi direct bus nahi mili.</p>";
                return;
            }

            // Har bus ka card banakar screen par dikhao
            data.data.trips.forEach(trip => {
                const card = document.createElement("div");
                card.className = "bus-card";
                card.innerHTML = `
                    <strong>🚍 ${trip.service_type_name || 'Express Bus'}</strong><br>
                    🕒 Dep: <b>${trip.departure_time}</b> - Arr: <b>${trip.arrival_time}</b><br>
                    💵 Fare: ₹${trip.fare || 'N/A'} <br>
                    <small>Route: ${trip.route_name}</small>
                `;
                resultsDiv.appendChild(card);
            });
        }
    </script>
</body>
</html>
